// ── API ──
const API_URL = 'https://script.google.com/macros/s/AKfycbx1HGcTQEaG3fH3QovWQpL-4GgjMqM_9mH4wYaA2_RDhbDPvYAuVfGtUCQ0enxnWy3G/exec';
function callApi(action, payload){
  // No Content-Type header → avoids CORS preflight (Apps Script doesn't handle OPTIONS)
  return fetch(API_URL, {
    method:'POST',
    body: JSON.stringify(Object.assign({action:action}, payload||{}))
  }).then(function(r){return r.json()});
}

// Drive 파일을 Apps Script로 proxy 다운로드 (session 검증 후 base64 → blob 다운로드 트리거)
function downloadProxyFile(fileType){
  var token = (typeof sessionStorage!=='undefined') ? sessionStorage.getItem('portal_token') : null;
  return callApi('downloadFile', {token:token, fileType:fileType}).then(function(res){
    if(!res || !res.success){
      alert((res && res.message) || 'Download failed');
      return;
    }
    var bin = atob(res.data);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], {type: res.mimeType || 'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = res.fileName || 'download';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
  }).catch(function(err){
    alert('Download failed: ' + (err && err.message ? err.message : err));
  });
}

// ── SVG Icons ──
function Ico({d,w,h:hh,sw,ch}){
  return React.createElement('svg',{width:w||20,height:hh||20,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:sw||2,strokeLinecap:'round',strokeLinejoin:'round'},
    ...(Array.isArray(d)?d:[d]).map(function(p,i){
      if(typeof p==='string') return React.createElement('path',{key:i,d:p});
      return React.createElement(p.t||'path',Object.assign({key:i},p));
    }),
    ch||null
  );
}

  alert: function(){return Ico({d:[{t:'circle',cx:'12',cy:'12',r:'10'},{t:'line',x1:'12',y1:'8',x2:'12',y2:'12'},{t:'line',x1:'12',y1:'16',x2:'12.01',y2:'16'}],w:16,h:16})},
  download: function(){return Ico({d:['M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4',{t:'polyline',points:'7 10 12 15 17 10'},{t:'line',x1:'12',y1:'15',x2:'12',y2:'3'}],w:16,h:16})},

  shield: function(){return Ico({d:['M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'],w:14,h:14})},

  send: function(){return Ico({d:[{t:'line',x1:'22',y1:'2',x2:'11',y2:'13'},{t:'polygon',points:'22 2 15 22 11 13 2 9 22 2'}],w:14,h:14})},
  salary: function(){return Ico({d:[{t:'rect',x:'2',y:'5',width:'20',height:'14',rx:'2'},{t:'line',x1:'2',y1:'10',x2:'22',y2:'10'},{t:'line',x1:'6',y1:'15',x2:'10',y2:'15'}]})},
};

// 대시보드 + 공지를 동시에 로드해서 faculty state로 머지될 객체 반환 (실패 시 null)
function loadPortalData(token){
  return Promise.all([
    callApi('getDashboard',{token:token}),
    callApi('getNotices',{token:token})
  ]).then(function(results){
    var dash=results[0], nx=results[1];
    if(dash.expired||nx.expired) return null;
    if(!dash.success) return null;
    return Object.assign({},MOCK,dash.faculty,{
      notices:(nx.success&&nx.notices)?nx.notices:[],
      documents: dash.documents || MOCK.documents,
      courses: dash.courses || MOCK.courses,
      housing: dash.housing || MOCK.housing,
      resources: dash.resources || MOCK.resources,
      salary: dash.salary || MOCK.salary,
    });
  });
}

// ── Helpers ──
function S(){return Object.assign.apply(null,[{}].concat(Array.prototype.slice.call(arguments)))}

function Card(props){
  return h('div',{style:S({background:T.card,borderRadius:14,boxShadow:'0 1px 4px rgba(0,0,0,.06)',border:'1px solid '+T.bdr,padding:24},props.style||{})},props.children);
}

function Badge(props){
  var m={signed:{bg:T.greenL,c:T.green,t:'Signed'},submitted:{bg:T.greenL,c:T.green,t:'Submitted'},partial:{bg:T.amberL,c:T.amber,t:'Partial'},pending:{bg:'#fef2f2',c:T.red,t:'Pending'}};
  var s=m[props.status]||m.pending;
  return h('span',{style:{display:'inline-flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:20,fontSize:12,fontWeight:600,background:s.bg,color:s.c}},
    (props.status==='signed'||props.status==='submitted')?Icons.check():Icons.clock(),' ',s.t);
}

// ── Main App ──
function App(){
  var initialScreen = (typeof sessionStorage!=='undefined' && sessionStorage.getItem('portal_token')) ? 'restoring' : 'login';
  var _s=useState(initialScreen),screen=_s[0],setScreen=_s[1];
  var _e=useState(''),employeeId=_e[0],setEmployeeId=_e[1];
  var _d=useState(''),dob=_d[0],setDob=_d[1];
  var _o=useState(''),otp=_o[0],setOtp=_o[1];
  var _ec=useState(0),emailCount=_ec[0],setEmailCount=_ec[1];
  var _l=useState(false),loading=_l[0],setLoading=_l[1];
  var _er=useState(''),error=_er[0],setError=_er[1];
  var _t=useState('dashboard'),tab=_t[0],setTab=_t[1];
  var _f=useState(null),faculty=_f[0],setFaculty=_f[1];
  var _n=useState(null),selNotice=_n[0],setSelNotice=_n[1];
  var _dl=useState(null),downloading=_dl[0],setDownloading=_dl[1];

  // 페이지 로드 시 세션 복원 시도
  useEffect(function(){
    if(initialScreen!=='restoring') return;
    var token=sessionStorage.getItem('portal_token');
    loadPortalData(token).then(function(data){
      if(data){setFaculty(data);if(data.isAdmin)setTab('admin');setScreen('portal');}
      else{sessionStorage.removeItem('portal_token');setScreen('login');}
    }).catch(function(){
      // 네트워크 에러: 토큰 보존하고 로그인 화면으로 (다음 시도에서 복원 재시도 가능)
      setScreen('login');
    });
  },[]);

  function handleLogin(){
    var eid = employeeId.trim().toUpperCase();
    if(!eid){setError('Please enter your Employee ID.');return;}
    var dobDigits = (dob||'').replace(/\D/g,'');
    if(dobDigits.length!==6){setError('Please enter your date of birth as YYMMDD (6 digits).');return;}
    setLoading(true);setError('');
    callApi('verifyIdentity',{employeeId:eid,birthDate:dobDigits}).then(function(res){
      setLoading(false);
      if(res.success){setScreen('otp');setOtp('');setEmailCount(res.emailCount||1);}
      else{setError(res.message||'Verification failed.');}
    }).catch(function(){
      setLoading(false);setError('Network error. Please try again.');
    });
  }
  function handleOtpVerify(){
    if(otp.length!==6){setError('Please enter the 6-digit code.');return;}
    var eid = employeeId.trim().toUpperCase();
    setLoading(true);setError('');
    callApi('verifyOtp',{employeeId:eid,otp:otp}).then(function(res){
      if(!(res.success&&res.token)){
        setLoading(false);setError(res.message||'Verification failed.');return;
      }
      sessionStorage.setItem('portal_token',res.token);
      return loadPortalData(res.token).then(function(data){
        setLoading(false);
        if(data){setFaculty(data);if(data.isAdmin)setTab('admin');setScreen('portal');}
        else{sessionStorage.removeItem('portal_token');setError('Failed to load portal data.');}
      });
    }).catch(function(){
      setLoading(false);setError('Network error. Please try again.');
    });
  }
  function handleLogout(){
    sessionStorage.removeItem('portal_token');
    setScreen('login');setFaculty(null);setEmployeeId('');setDob('');setOtp('');setError('');setEmailCount(0);setTab('dashboard');setSelNotice(null);
  }

  // ── Styles ──
  var fadeStyle = h('style',null,'@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(min-width:768px){.desk-show{display:block!important}.mob-hide{display:none!important}}');
  var loginBg = {minHeight:'100vh',background:'linear-gradient(135deg,'+T.navyD+' 0%,'+T.navy+' 50%,'+T.navyL+' 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:20,fontFamily:"'Noto Sans',-apple-system,sans-serif"};
  var inputStyle = function(v){return{width:'100%',padding:'10px 14px',border:'1.5px solid '+T.bdr,borderRadius:8,fontSize:14,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}};
  var btnPrimary = {width:'100%',padding:'12px 16px',background:T.navy,color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:600,fontFamily:'inherit'};

  // ── RESTORING (세션 복원 중) ──
  if(screen==='restoring'){
    return h('div',{style:loginBg},
      h('div',{style:{color:'rgba(255,255,255,.7)',fontSize:13,fontFamily:"'Noto Sans',-apple-system,sans-serif"}},'Restoring session...')
    );
  }

  // ── LOGIN ──
  if(screen==='login'){
    return h('div',{style:loginBg},
      fadeStyle,
      h('div',{style:{width:'100%',maxWidth:420,animation:'fadeIn .5s ease'}},
        h('div',{style:{textAlign:'center',marginBottom:32}},
          h('div',{style:{width:64,height:64,background:'rgba(255,255,255,.12)',borderRadius:16,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:16}},
            h('span',{style:{fontSize:28}},'🏛️')),
          h('h1',{style:{color:'#fff',fontSize:26,fontFamily:"'Playfair Display',serif",fontWeight:700,margin:'0 0 4px',letterSpacing:'-.5px'}},'YISS Faculty Portal'),
          h('p',{style:{color:'rgba(255,255,255,.6)',fontSize:13,margin:0}},'Yonsei International Summer School')
        ),
        h('div',{style:{background:'#fff',borderRadius:16,padding:'32px 28px',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}},
          h('div',{style:{marginBottom:14}},
            h('label',{style:{display:'block',fontSize:12,fontWeight:600,color:T.text,marginBottom:6}},'Employee ID (교번)'),
            h('input',{type:'text',value:employeeId,onChange:function(e){setEmployeeId(e.target.value)},placeholder:'Z0000000',autoCapitalize:'characters',autoCorrect:'off',spellCheck:false,style:S(inputStyle(),{letterSpacing:1,fontFamily:"'Noto Sans',monospace"})})
          ),
          h('div',{style:{marginBottom:20}},
            h('label',{style:{display:'block',fontSize:12,fontWeight:600,color:T.text,marginBottom:6}},'Date of Birth (YYMMDD)'),
            h('input',{type:'text',value:dob,onChange:function(e){setDob(e.target.value.replace(/\D/g,'').slice(0,6))},placeholder:'YYMMDD',inputMode:'numeric',maxLength:6,autoComplete:'off',style:S(inputStyle(),{letterSpacing:1,fontFamily:"'Noto Sans',monospace"})})
          ),
          error&&h('p',{style:{fontSize:13,color:T.red,margin:'0 0 14px',padding:'8px 12px',background:'#fef2f2',borderRadius:8}},error),
          h('button',{onClick:handleLogin,disabled:loading,style:S(btnPrimary,{opacity:loading?.7:1})},loading?'Verifying...':'Send Verification Code'),
          h('p',{style:{fontSize:11,color:T.sub,textAlign:'center',margin:'16px 0 0',lineHeight:1.5,display:'flex',alignItems:'center',justifyContent:'center',gap:4}},
            Icons.shield(),' A 6-digit code will be sent to your registered email(s)')
        ),
        h('p',{style:{textAlign:'center',fontSize:11,color:'rgba(255,255,255,.4)',marginTop:20}},'Office of International Affairs, Yonsei University')
      )
    );
  }

  // ── OTP ──
  if(screen==='otp'){
    return h('div',{style:loginBg},
      fadeStyle,
      h('div',{style:{width:'100%',maxWidth:420,animation:'fadeIn .5s ease'}},
        h('div',{style:{textAlign:'center',marginBottom:32,color:'#fff'}},
          h('div',{style:{width:64,height:64,background:'rgba(255,255,255,.12)',borderRadius:16,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:16,color:'#fff'}},Icons.mail()),
          h('h2',{style:{fontSize:22,margin:'0 0 6px',fontFamily:"'Playfair Display',serif"}},'Check Your Email'),
          h('p',{style:{color:'rgba(255,255,255,.6)',fontSize:13,margin:0}},
            emailCount>1
              ? ['We sent a code to ',h('strong',{style:{color:'rgba(255,255,255,.85)'}},'all '+emailCount+' of your registered emails')]
              : ['We sent a code to your registered email'])
        ),
        h('div',{style:{background:'#fff',borderRadius:16,padding:'32px 28px',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}},
          h('div',{style:{marginBottom:20}},
            h('label',{style:{display:'block',fontSize:12,fontWeight:600,color:T.text,marginBottom:6}},'Verification Code'),
            h('input',{type:'text',value:otp,onChange:function(e){setOtp(e.target.value.replace(/\D/g,'').slice(0,6))},placeholder:'000000',maxLength:6,style:{width:'100%',padding:14,border:'1.5px solid '+T.bdr,borderRadius:8,fontSize:28,fontWeight:700,textAlign:'center',letterSpacing:12,outline:'none',boxSizing:'border-box',fontFamily:"'Noto Sans',monospace"}})
          ),
          error&&h('p',{style:{fontSize:13,color:T.red,margin:'0 0 14px',padding:'8px 12px',background:'#fef2f2',borderRadius:8}},error),
          h('button',{onClick:handleOtpVerify,disabled:loading||otp.length<6,style:S(btnPrimary,{opacity:(loading||otp.length<6)?.6:1})},loading?'Verifying...':'Sign In'),
          h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:16}},
            h('button',{onClick:function(){setScreen('login');setError('');},style:{background:'none',border:'none',color:T.navy,fontSize:13,fontWeight:500,cursor:'pointer',fontFamily:'inherit'}},'← Back'),
            h('button',{onClick:function(){
              setError('');setLoading(true);
              var eid=employeeId.trim().toUpperCase();
              var dobDigits=(dob||'').replace(/\D/g,'');
              callApi('verifyIdentity',{employeeId:eid,birthDate:dobDigits}).then(function(res){
                setLoading(false);
                if(res.success){setOtp('');alert('A new code has been sent to your email'+(res.emailCount>1?'s':'')+'.');}
                else{setError(res.message||'Failed to resend code.');}
              }).catch(function(){setLoading(false);setError('Network error.');});
            },disabled:loading,style:{background:'none',border:'none',color:T.sub,fontSize:13,cursor:loading?'wait':'pointer',fontFamily:'inherit'}},'Resend code')
          )
        ),
        h('p',{style:{textAlign:'center',fontSize:11,color:'rgba(255,255,255,.35)',marginTop:16}},'Code expires in 5 minutes')
      )
    );
  }

  // ── PORTAL ──
  var tabs = faculty.isAdmin===true
    ? [
        {key:'admin',label:'Admin',icon:Icons.admin},
        {key:'notices',label:'Notices',icon:Icons.notices},
      ]
    : [
        {key:'dashboard',label:'Dashboard',icon:Icons.dashboard},
        {key:'courses',label:'My Courses',icon:Icons.courses},
        {key:'documents',label:'Documents',icon:Icons.documents},
        {key:'salary',label:'Salary',icon:Icons.salary},
        {key:'notices',label:'Notices',icon:Icons.notices},
      ];

  function DashboardTab(){
    return h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
      h('div',{style:{background:'linear-gradient(135deg,'+T.navy+','+T.navyL+')',borderRadius:14,padding:'28px 24px',color:'#fff'}},
        h('p',{style:{fontSize:13,opacity:.7,margin:'0 0 4px'}},'Welcome back,'),
        h('h2',{style:{fontSize:24,fontWeight:700,margin:'0 0 4px',fontFamily:"'Playfair Display',serif"}},faculty.name),
        h('p',{style:{fontSize:12,opacity:.6,margin:'4px 0 0'}},'Faculty ID: '+faculty.employeeId)
      ),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12}},
        [{l:'Courses',v:faculty.courses.length,c:T.navy},{l:'Contract',v:faculty.documents.contract.status==='signed'?'Signed':'Pending',c:faculty.documents.contract.status==='signed'?T.green:T.amber},{l:'Notices',v:faculty.notices.length,c:T.navy}].map(function(s,i){
          return h(Card,{key:i,style:{textAlign:'center',padding:'18px 12px'}},
            h('div',{style:{fontSize:24,fontWeight:700,color:s.c}},s.v),
            h('div',{style:{fontSize:12,color:T.sub,marginTop:2}},s.l));
        })
      ),
      h(Card,null,
        h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:'0 0 14px'}},'Action Required'),
        (function(){
          var actions=[];
          if(faculty.documents.contract.status!=='signed'){
            actions.push({key:'contract',label:'Sign your employment contract — check your email for the signing link and all related documents.',link:faculty.documents.contract.link,tab:'documents'});
          }
          if(faculty.documents.reappointment.applicable && faculty.documents.reappointment.status!=='submitted'){
            actions.push({key:'reappointment',label:'Submit reappointment documents',link:faculty.documents.reappointment.link});
          }
          if(faculty.salary && !faculty.salary.submitted){
            actions.push({key:'salary',label:'Submit salary disbursement form'+(faculty.salary.deadline?(' (by '+faculty.salary.deadline+')'):''),tab:'salary'});
          }
          if(actions.length===0){
            return h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:T.greenL,borderRadius:8}},
              h('span',{style:{color:T.green}},Icons.check()),h('span',{style:{fontSize:13,color:T.green,fontWeight:500}},'All tasks completed!'));
          }
          return actions.map(function(a){
            var openBtn = a.tab
              ? h('button',{onClick:function(){setTab(a.tab)},style:{background:'none',border:'none',padding:0,fontSize:12,color:T.navy,fontWeight:600,whiteSpace:'nowrap',cursor:'pointer',fontFamily:'inherit'}},'Open →')
              : a.link

    }

    var sectionHead = function(t){return h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:'0 0 16px',paddingBottom:10,borderBottom:'1px solid '+T.bdr}},t)};

    var payments = salary.payments || {courses:[],total:'',hasData:false};
    var courseLabel = function(i,n){ if(n<=1) return 'Payment Amount'; var ord=['1st','2nd','3rd','4th','5th']; return (ord[i]||((i+1)+'th'))+' Course'; };
    return h('div',{style:{display:'flex',flexDirection:'column',gap:16,maxWidth:760}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}},
        h('h2',{style:{fontSize:20,fontWeight:700,color:T.navy,margin:0,fontFamily:"'Playfair Display',serif"}},'Salary Disbursement'),
        status.submitted ? Badge({status:'submitted'}) : Badge({status:'pending'})
      ),
      payments.hasData && h(Card,null,
        h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:'0 0 12px'}},'💰 Your Payment Amount'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
          payments.courses.map(function(p,i){
            return h('div',{key:i,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:i<payments.courses.length-1||payments.total?'1px solid '+T.bdr:'none',fontSize:14}},
              h('span',{style:{color:T.text}},courseLabel(i,payments.courses.length)),
              h('span',{style:{color:T.text,fontWeight:600,fontFamily:'monospace'}},p.amount||'—'));
          }),
          payments.total && h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0 0',fontSize:14}},
            h('span',{style:{color:T.navy,fontWeight:700}},'Total'),
            h('span',{style:{color:T.navy,fontWeight:700,fontFamily:'monospace'}},payments.total))
        )
      ),
      h(Card,{style:{background:'#f8f9fb'}},
        h('p',{style:{margin:'0 0 8px',fontSize:13,color:T.text}},
          h('strong',null,'Deadline: '),h('span',{style:{color:T.navy,fontWeight:600}},salary.deadline||'—')),
        h('p',{style:{margin:'0 0 6px',fontSize:13,color:T.text}},'Section 2 is only used for Salary Disbursement for ',h('strong',null,salary.yearLabel||'2026 YISS'),'.'),
        h('p',{style:{margin:'0 0 6px',fontSize:13,color:T.text}},'• If you use a ',h('strong',null,'Korean bank account'),', please fill out ',h('strong',null,'N/A'),' for fields 4–8.'),
        h('p',{style:{margin:'0 0 6px',fontSize:13,color:T.text}},'• Flight Reimbursement will also be given to this bank account information.'),
        salary.payment4w && h('p',{style:{margin:'0 0 6px',fontSize:13,color:T.text}},'• ',h('strong',null,'4-Week Program: '),salary.payment4w),
        salary.payment6w && h('p',{style:{margin:'0 0 6px',fontSize:13,color:T.text}},'• ',h('strong',null,'6-Week Program: '),salary.payment6w),
        h('p',{style:{margin:'10px 0 0',fontSize:12,color:T.sub}},'Questions? Contact ',h('a',{href:'mailto:'+(salary.contactEmail||''),style:{color:T.navy}},salary.contactEmail||'isummer@yonsei.ac.kr'),'.'),
        status.submitted && status.updatedAt && h('p',{style:{margin:'8px 0 0',fontSize:11,color:T.sub}},'Last updated: ',status.updatedAt)
      ),
      h(Card,null,
        sectionHead('Section 1. Personal Information'),
        fieldText({label:'1. Full Name of Faculty',field:'fullName',required:true}),
        fieldText({label:'2. Date of Birth',field:'dateOfBirth',locked:true,placeholder:'YYYY-MM-DD'}),
        fieldText({label:'3. Passport No. (used to enter Korea) or Alien Registration No.',field:'passportOrArc',required:true}),
        fieldText({label:'4. Nationality (Passport used to enter Korea)',field:'nationality',required:true}),
        fieldText({label:'5. Telephone (cell phone) No.',field:'telephone',required:true,placeholder:'e.g., +82-10-1234-5678'}),
        h('div',{style:{margin:'8px 0 14px',padding:'10px 12px',background:'#f8f9fb',borderRadius:8,fontSize:12,color:T.sub,lineHeight:1.55}},
          h('strong',{style:{color:T.text}},'Mailing Address (for remittance form)'),h('br'),
          'Enter the address where you reside / receive mail. This appears on the bank remittance application as the beneficiary’s address.'),
        fieldText({label:'6. Street Address',field:'streetAddress',required:true,placeholder:'e.g., 50 Yonsei-ro, Seodaemun-gu'}),
        fieldText({label:'7. City',field:'city',required:true,placeholder:'e.g., Seoul'}),
        fieldText({label:'8. Region / State / Province',field:'region',required:true,placeholder:'e.g., Seoul / California / N/A'}),
        fieldText({label:'9. Country',field:'mailingCountry',required:true,placeholder:'e.g., South Korea'}),
        fieldYesNo({label:'10. Do you have a permanent address in Korea?',field:'permanentAddressKorea'}),
        fieldYesNo({label:'11. Do you continue to live, or plan to live, in Korea for more than 183 days?',field:'liveOver183Days'}),
        fieldYesNo({label:'12. Do you have a job that requires you to stay in Korea for more than 183 days continuously?',field:'jobRequiresStay'}),
        fieldYesNo({label:'13. Are there any family members (spouse, children, etc.) living together with you in Korea?',field:'familyInKorea'}),
        fieldYesNo({label:'14. Do you have a basis for living in Korea such as business or real estate?',field:'koreanBusinessOrRE'}),
        h('div',{style:{marginTop:8,padding:'12px 14px',background:'#f8f9fb',borderRadius:8}},
          fieldCheckbox({field:'attestation',required:true,label:'15. I attest that all information provided above is true, and I will bear responsibility if any disadvantage occurs from false indication of the information.'})
        ),
        h('div',{style:{marginTop:8,padding:'12px 14px',background:'#f8f9fb',borderRadius:8}},
          h('p',{style:{fontSize:12,color:T.sub,margin:'0 0 10px',lineHeight:1.6}},
            h('strong',{style:{color:T.text}},'16. Consent of Personal Information'),h('br'),
            h('strong',null,'16-1. Purpose: '),'Signing/fulfillment of the employment contract, faculty personnel management, and personnel record management.',h('br'),
            h('strong',null,'16-2. Personal Information Collected: '),'Full Name, Date of Birth, Passport No., Alien Registration No., Nationality, Telephone No., Mailing Address.',h('br'),h('br'),
            h('em',null,'※ You have the right to reject the collection and use of personal information, but if you exercise this right you will not be able to be employed at the university.')
          ),
          fieldCheckbox({field:'consent',required:true,label:'I consent to the collection and use of my personal information as described above.'})
        )
      ),
      h(Card,null,
        sectionHead('Section 2. Bank Account Information'),
        h('p',{style:{fontSize:12,color:T.sub,margin:'-8px 0 14px',lineHeight:1.55,padding:'8px 12px',background:T.amberL,color:T.amber,borderRadius:6}},
          h('strong',null,'Note: '),'If you use a Korean bank account, please fill out ',h('strong',null,'N/A'),' for fields 4–8.'),
        fieldText({label:'1. Full Name (Beneficiary Name) used for the bank account',field:'beneficiaryName',required:true}),
        fieldText({label:'2. Beneficiary (Receiving) Bank Name',field:'bankName',required:true}),
        fieldText({label:'3. Beneficiary (Receiving) Bank Account No.',field:'accountNo',required:true,placeholder:'Leading zeros will be preserved'}),
        fieldText({label:'4. Receiving Bank Branch Name',field:'branchName',required:true,placeholder:'N/A for Korean bank'}),
        fieldText({label:'5. Beneficiary (Receiving) Bank Address — Street Name',field:'bankAddress',required:true,placeholder:'N/A for Korean bank'}),
        fieldText({label:'6. Beneficiary (Receiving) Bank Address — Town Location',field:'bankTownLocation',required:true,placeholder:'N/A for Korean bank'}),
        fieldText({label:'7. Beneficiary (Receiving) Bank Address — Town Name',field:'bankTownName',required:true,placeholder:'N/A for Korean bank'}),
        fieldText({label:'8. Country Location of Beneficiary (Receiving) Bank',field:'country',required:true,placeholder:'N/A for Korean bank'}),
        fieldText({label:'9. Bank Code: ABA No. (9 digits for American account)',field:'abaNo',required:true,placeholder:'N/A for Korean bank'}),
        fieldText({label:'10. SWIFT Code',field:'swiftCode',required:true,placeholder:'N/A for Korean bank'})
      ),
      formError && h('div',{style:{padding:'10px 14px',background:'#fef2f2',color:T.red,borderRadius:8,fontSize:13}},formError),
      justSaved && h('div',{style:{padding:'10px 14px',background:T.greenL,color:T.green,borderRadius:8,fontSize:13,fontWeight:500,display:'flex',alignItems:'center',gap:6}},Icons.check(),' Submitted successfully.'),
      formLocked
        ? h('div',{style:{padding:'12px 14px',background:T.greenL,color:T.green,borderRadius:8,fontSize:13,lineHeight:1.55}},
            h('strong',null,'Form locked. '),'Your submission has been received',status.submittedAt?(' on '+status.submittedAt):'','. To correct any information, please contact ',h('a',{href:'mailto:'+(salary.contactEmail||''),style:{color:T.green,fontWeight:600}},salary.contactEmail||'isummer@yonsei.ac.kr'),'.')
        : h('button',{onClick:submit,disabled:saving,style:S(btnPrimary,{opacity:saving?.7:1,maxWidth:260,alignSelf:'flex-start'})},
            saving ? 'Saving…' : 'Submit'
          )
    );
  }

  var tabContent={dashboard:DashboardTab,courses:CoursesTab,documents:DocumentsTab,notices:NoticesTab,admin:AdminTab,salary:SalaryTab};

  return h('div',{style:{minHeight:'100vh',background:T.bg,fontFamily:"'Noto Sans',-apple-system,sans-serif"}},
    fadeStyle,
    // Top Nav
    h('nav',{style:{background:T.navy,padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',height:56,position:'sticky',top:0,zIndex:100}},
      h('div',{style:{display:'flex',alignItems:'center',gap:12}},
        h('span',{style:{fontSize:20}},'🏛️'),
        h('span',{style:{color:'#fff',fontSize:15,fontWeight:700,fontFamily:"'Playfair Display',serif"}},'YISS Faculty Portal')),
      h('div',{style:{display:'flex',alignItems:'center',gap:16}},
        h('span',{style:{color:'rgba(255,255,255,.7)',fontSize:13}},faculty.name),
        h('button',{onClick:handleLogout,style:{background:'rgba(255,255,255,.1)',border:'none',borderRadius:8,padding:'6px 12px',color:'rgba(255,255,255,.8)',display:'flex',alignItems:'center',gap:6,fontSize:12,fontFamily:'inherit',fontWeight:500}},
          Icons.logout(),' Sign Out'))
    ),
    h('div',{style:{display:'flex',maxWidth:1100,margin:'0 auto',padding:'0 16px'}},
      // Sidebar
      h('aside',{className:'desk-show',style:{width:220,padding:'20px 0',flexShrink:0,position:'sticky',top:56,height:'calc(100vh - 56px)',display:'none'}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
          tabs.map(function(t){
            return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,border:'none',background:tab===t.key?'rgba(0,55,100,.08)':'transparent',color:tab===t.key?T.navy:T.sub,fontSize:14,fontWeight:tab===t.key?600:400,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}},
              t.icon(),' ',t.label);
          }))),
      // Main
      h('main',{style:{flex:1,padding:'20px 0 100px',minWidth:0,marginLeft:16}},
        h(tabContent[tab]))
    ),
    // Mobile Bottom Nav
    h('div',{className:'mob-hide',style:{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid '+T.bdr,display:'flex',justifyContent:'space-around',padding:'6px 0',zIndex:100}},
      tabs.map(function(t){
        return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,background:'none',border:'none',padding:'6px 12px',color:tab===t.key?T.navy:T.sub,fontFamily:'inherit',fontSize:10,fontWeight:tab===t.key?600:400}},
          t.icon(),t.label);
      }))
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
