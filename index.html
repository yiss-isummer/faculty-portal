<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YISS Faculty Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
    input:focus{outline:none}
    button{cursor:pointer}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
const { useState, useEffect, useCallback, createElement: h } = React;

// ── Theme ──
const T = {
  navy:'#003764', navyL:'#0a4a7a', navyD:'#002244',
  gold:'#C4972A', red:'#c41230', green:'#0d9668', greenL:'#d1fae5',
  amber:'#d97706', amberL:'#fef3c7', bg:'#f0f2f5', card:'#fff',
  text:'#1a1a2e', sub:'#5a6070', bdr:'#e2e5ea'
};

// ── SVG Icons ──
function Ico({d,w,h:hh,sw,ch}){
  return React.createElement('svg',{width:w||20,height:hh||20,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:sw||2,strokeLinecap:'round',strokeLinejoin:'round'},
    ...(Array.isArray(d)?d:[d]).map(function(p,i){
      if(typeof p==='string') return React.createElement('path',{key:i,d:p});
      return React.createElement(p.t||'path',Object.assign({key:i},p));
    }),
    ch||null
  );
}
var Icons = {
  dashboard: function(){return Ico({d:[{t:'rect',x:'3',y:'3',width:'7',height:'7',rx:'1'},{t:'rect',x:'14',y:'3',width:'7',height:'7',rx:'1'},{t:'rect',x:'3',y:'14',width:'7',height:'7',rx:'1'},{t:'rect',x:'14',y:'14',width:'7',height:'7',rx:'1'}]})},
  courses: function(){return Ico({d:['M4 19.5A2.5 2.5 0 016.5 17H20','M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z']})},
  documents: function(){return Ico({d:['M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z','M14 2v6h6']})},
  notices: function(){return Ico({d:['M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9','M13.73 21a2 2 0 01-3.46 0']})},
  logout: function(){return Ico({d:['M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4',{t:'polyline',points:'16 17 21 12 16 7'},{t:'line',x1:'21',y1:'12',x2:'9',y2:'12'}]})},
  check: function(){return Ico({d:[{t:'polyline',points:'20 6 9 17 4 12'}],w:16,h:16,sw:2.5})},
  clock: function(){return Ico({d:[{t:'circle',cx:'12',cy:'12',r:'10'},{t:'polyline',points:'12 6 12 12 16 14'}],w:16,h:16})},
  alert: function(){return Ico({d:[{t:'circle',cx:'12',cy:'12',r:'10'},{t:'line',x1:'12',y1:'8',x2:'12',y2:'12'},{t:'line',x1:'12',y1:'16',x2:'12.01',y2:'16'}],w:16,h:16})},
  download: function(){return Ico({d:['M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4',{t:'polyline',points:'7 10 12 15 17 10'},{t:'line',x1:'12',y1:'15',x2:'12',y2:'3'}],w:16,h:16})},
  mail: function(){return Ico({d:['M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z',{t:'polyline',points:'22,6 12,13 2,6'}]})},
  shield: function(){return Ico({d:['M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'],w:14,h:14})},
};
function GoogleIcon(){
  return React.createElement('svg',{width:20,height:20,viewBox:'0 0 24 24'},
    h('path',{d:'M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z',fill:'#4285F4'}),
    h('path',{d:'M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z',fill:'#34A853'}),
    h('path',{d:'M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z',fill:'#FBBC05'}),
    h('path',{d:'M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z',fill:'#EA4335'})
  );
}

// ── Mock Data ──
var MOCK = {
  name:'Rebeca Baek', employeeId:'3006463', email:'rebeca@example.com',
  dept:'Office of International Affairs', position:'Adjunct Professor', nationality:'Brazilian',
  courses:[
    {code:'GLC3146',title:'Korean Pop Culture and Visual Art',period:'6-week',schedule:'Mon/Wed 10:00-11:50',room:'Samsung Hall 401',students:45,syllabusUploaded:true},
    {code:'GLC2138',title:'Introduction to Korean Studies',period:'6-week',schedule:'Tue/Thu 14:00-15:50',room:'Daewoo Hall 201',students:38,syllabusUploaded:false},
  ],
  documents:{
    contract:{status:'signed',date:'2026-03-15',fileName:'Contract_Rebeca_Baek.pdf'},
    reappointment:{status:'submitted',date:'2026-04-01',files:['Employment_Certificate.pdf','Passport_Copy.jpg','Consent_Form.pdf']},
    syllabus:{status:'partial',submitted:1,total:2},
  },
  notices:[
    {id:1,title:'YISS 2026 Faculty Orientation',date:'2026-06-26',priority:'high',content:'Please attend the faculty orientation on June 26 at 9:00 AM in Baekyang Hall. The orientation will cover course logistics, campus tour, and administrative procedures.'},
    {id:2,title:'Syllabus Submission Deadline',date:'2026-05-15',priority:'medium',content:'All syllabi must be submitted by May 15, 2026 through the Faculty Portal. Please ensure your syllabus follows the YISS template.'},
    {id:3,title:'Grade Submission Guidelines',date:'2026-04-10',priority:'low',content:'Grades must be submitted within 5 business days after the final exam through the Yonsei Portal.'},
    {id:4,title:'Campus Facilities Guide',date:'2026-04-05',priority:'low',content:'Information about International House, library access, cafeteria, and gym facilities for summer faculty.'},
  ]
};

// ── Helpers ──
function S(){return Object.assign.apply(null,[{}].concat(Array.prototype.slice.call(arguments)))}

function Card(props){
  return h('div',{style:S({background:T.card,borderRadius:14,boxShadow:'0 1px 4px rgba(0,0,0,.06)',border:'1px solid '+T.bdr,padding:24},props.style||{})},props.children);
}

function Badge(props){
  var m={signed:{bg:T.greenL,c:T.green,t:'Signed'},submitted:{bg:T.greenL,c:T.green,t:'Submitted'},partial:{bg:T.amberL,c:T.amber,t:'Partial'},pending:{bg:'#fef2f2',c:T.red,t:'Pending'}};
  var s=m[props.status]||m.pending;
  return h('span',{style:{display:'inline-flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:20,fontSize:12,fontWeight:600,background:s.bg,color:s.c}},
    (props.status==='signed'||props.status==='submitted')?Icons.check():Icons.clock(),' ',s.t);
}

// ── Main App ──
function App(){
  var _s=useState('login'),screen=_s[0],setScreen=_s[1];
  var _e=useState(''),email=_e[0],setEmail=_e[1];
  var _d=useState(''),dob=_d[0],setDob=_d[1];
  var _o=useState(''),otp=_o[0],setOtp=_o[1];
  var _l=useState(false),loading=_l[0],setLoading=_l[1];
  var _er=useState(''),error=_er[0],setError=_er[1];
  var _t=useState('dashboard'),tab=_t[0],setTab=_t[1];
  var _f=useState(null),faculty=_f[0],setFaculty=_f[1];
  var _n=useState(null),selNotice=_n[0],setSelNotice=_n[1];

  function handleEmailLogin(){
    setLoading(true);setError('');
    setTimeout(function(){
      if(!email.includes('@')){setError('Please enter a valid email address.');setLoading(false);return;}
      if(!dob){setError('Please enter your date of birth.');setLoading(false);return;}
      setScreen('otp');setLoading(false);
    },800);
  }
  function handleOtpVerify(){
    setLoading(true);setError('');
    setTimeout(function(){
      if(otp.length!==6){setError('Please enter the 6-digit code.');setLoading(false);return;}
      setFaculty(MOCK);setScreen('portal');setLoading(false);
    },600);
  }
  function handleGoogleLogin(){
    setLoading(true);
    setTimeout(function(){setFaculty(MOCK);setScreen('portal');setLoading(false);},1000);
  }
  function handleLogout(){
    setScreen('login');setFaculty(null);setEmail('');setDob('');setOtp('');setError('');setTab('dashboard');setSelNotice(null);
  }

  // ── Styles ──
  var fadeStyle = h('style',null,'@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(min-width:768px){.desk-show{display:block!important}.mob-hide{display:none!important}}');
  var loginBg = {minHeight:'100vh',background:'linear-gradient(135deg,'+T.navyD+' 0%,'+T.navy+' 50%,'+T.navyL+' 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:20,fontFamily:"'Noto Sans',-apple-system,sans-serif"};
  var inputStyle = function(v){return{width:'100%',padding:'10px 14px',border:'1.5px solid '+T.bdr,borderRadius:8,fontSize:14,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}};
  var btnPrimary = {width:'100%',padding:'12px 16px',background:T.navy,color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:600,fontFamily:'inherit'};

  // ── LOGIN ──
  if(screen==='login'){
    return h('div',{style:loginBg},
      fadeStyle,
      h('div',{style:{width:'100%',maxWidth:420,animation:'fadeIn .5s ease'}},
        h('div',{style:{textAlign:'center',marginBottom:32}},
          h('div',{style:{width:64,height:64,background:'rgba(255,255,255,.12)',borderRadius:16,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:16}},
            h('span',{style:{fontSize:28}},'🏛️')),
          h('h1',{style:{color:'#fff',fontSize:26,fontFamily:"'Playfair Display',serif",fontWeight:700,margin:'0 0 4px',letterSpacing:'-.5px'}},'YISS Faculty Portal'),
          h('p',{style:{color:'rgba(255,255,255,.6)',fontSize:13,margin:0}},'Yonsei International Summer School')
        ),
        h('div',{style:{background:'#fff',borderRadius:16,padding:'32px 28px',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}},
          h('button',{onClick:handleGoogleLogin,disabled:loading,style:{width:'100%',padding:'12px 16px',background:'#fff',border:'1.5px solid '+T.bdr,borderRadius:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10,fontSize:14,fontWeight:600,color:T.text,fontFamily:'inherit'}},
            GoogleIcon(),'Sign in with Google'),
          h('div',{style:{display:'flex',alignItems:'center',gap:12,margin:'24px 0'}},
            h('div',{style:{flex:1,height:1,background:T.bdr}}),
            h('span',{style:{fontSize:12,color:T.sub,fontWeight:500}},'or sign in with email'),
            h('div',{style:{flex:1,height:1,background:T.bdr}})
          ),
          h('div',{style:{marginBottom:14}},
            h('label',{style:{display:'block',fontSize:12,fontWeight:600,color:T.text,marginBottom:6}},'Email Address'),
            h('input',{type:'email',value:email,onChange:function(e){setEmail(e.target.value)},placeholder:'your.email@university.edu',style:inputStyle()})
          ),
          h('div',{style:{marginBottom:20}},
            h('label',{style:{display:'block',fontSize:12,fontWeight:600,color:T.text,marginBottom:6}},'Date of Birth'),
            h('input',{type:'date',value:dob,onChange:function(e){setDob(e.target.value)},style:inputStyle()})
          ),
          error&&h('p',{style:{fontSize:13,color:T.red,margin:'0 0 14px',padding:'8px 12px',background:'#fef2f2',borderRadius:8}},error),
          h('button',{onClick:handleEmailLogin,disabled:loading,style:S(btnPrimary,{opacity:loading?.7:1})},loading?'Verifying...':'Send Verification Code'),
          h('p',{style:{fontSize:11,color:T.sub,textAlign:'center',margin:'16px 0 0',lineHeight:1.5,display:'flex',alignItems:'center',justifyContent:'center',gap:4}},
            Icons.shield(),' A 6-digit verification code will be sent to your email')
        ),
        h('p',{style:{textAlign:'center',fontSize:11,color:'rgba(255,255,255,.4)',marginTop:20}},'Office of International Affairs, Yonsei University')
      )
    );
  }

  // ── OTP ──
  if(screen==='otp'){
    return h('div',{style:loginBg},
      fadeStyle,
      h('div',{style:{width:'100%',maxWidth:420,animation:'fadeIn .5s ease'}},
        h('div',{style:{textAlign:'center',marginBottom:32,color:'#fff'}},
          h('div',{style:{width:64,height:64,background:'rgba(255,255,255,.12)',borderRadius:16,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:16,color:'#fff'}},Icons.mail()),
          h('h2',{style:{fontSize:22,margin:'0 0 6px',fontFamily:"'Playfair Display',serif"}},'Check Your Email'),
          h('p',{style:{color:'rgba(255,255,255,.6)',fontSize:13,margin:0}},'We sent a code to ',h('strong',{style:{color:'rgba(255,255,255,.85)'}},email))
        ),
        h('div',{style:{background:'#fff',borderRadius:16,padding:'32px 28px',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}},
          h('div',{style:{marginBottom:20}},
            h('label',{style:{display:'block',fontSize:12,fontWeight:600,color:T.text,marginBottom:6}},'Verification Code'),
            h('input',{type:'text',value:otp,onChange:function(e){setOtp(e.target.value.replace(/\D/g,'').slice(0,6))},placeholder:'000000',maxLength:6,style:{width:'100%',padding:14,border:'1.5px solid '+T.bdr,borderRadius:8,fontSize:28,fontWeight:700,textAlign:'center',letterSpacing:12,outline:'none',boxSizing:'border-box',fontFamily:"'Noto Sans',monospace"}})
          ),
          error&&h('p',{style:{fontSize:13,color:T.red,margin:'0 0 14px',padding:'8px 12px',background:'#fef2f2',borderRadius:8}},error),
          h('button',{onClick:handleOtpVerify,disabled:loading||otp.length<6,style:S(btnPrimary,{opacity:(loading||otp.length<6)?.6:1})},loading?'Verifying...':'Sign In'),
          h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:16}},
            h('button',{onClick:function(){setScreen('login');setError('');},style:{background:'none',border:'none',color:T.navy,fontSize:13,fontWeight:500,cursor:'pointer',fontFamily:'inherit'}},'← Back'),
            h('button',{style:{background:'none',border:'none',color:T.sub,fontSize:13,cursor:'pointer',fontFamily:'inherit'}},'Resend code')
          )
        ),
        h('p',{style:{textAlign:'center',fontSize:11,color:'rgba(255,255,255,.35)',marginTop:16}},'Code expires in 5 minutes')
      )
    );
  }

  // ── PORTAL ──
  var tabs=[
    {key:'dashboard',label:'Dashboard',icon:Icons.dashboard},
    {key:'courses',label:'My Courses',icon:Icons.courses},
    {key:'documents',label:'Documents',icon:Icons.documents},
    {key:'notices',label:'Notices',icon:Icons.notices},
  ];

  function DashboardTab(){
    return h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
      h('div',{style:{background:'linear-gradient(135deg,'+T.navy+','+T.navyL+')',borderRadius:14,padding:'28px 24px',color:'#fff'}},
        h('p',{style:{fontSize:13,opacity:.7,margin:'0 0 4px'}},'Welcome back,'),
        h('h2',{style:{fontSize:24,fontWeight:700,margin:'0 0 4px',fontFamily:"'Playfair Display',serif"}},faculty.name),
        h('p',{style:{fontSize:13,opacity:.6,margin:0}},faculty.position+' · '+faculty.dept),
        h('p',{style:{fontSize:12,opacity:.5,margin:'4px 0 0'}},'Faculty ID: '+faculty.employeeId)
      ),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12}},
        [{l:'Courses',v:faculty.courses.length,c:T.navy},{l:'Contract',v:'Signed',c:T.green},{l:'Syllabus',v:faculty.documents.syllabus.submitted+'/'+faculty.documents.syllabus.total,c:faculty.documents.syllabus.submitted===faculty.documents.syllabus.total?T.green:T.amber},{l:'Notices',v:faculty.notices.length,c:T.navy}].map(function(s,i){
          return h(Card,{key:i,style:{textAlign:'center',padding:'18px 12px'}},
            h('div',{style:{fontSize:24,fontWeight:700,color:s.c}},s.v),
            h('div',{style:{fontSize:12,color:T.sub,marginTop:2}},s.l));
        })
      ),
      h(Card,null,
        h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:'0 0 14px'}},'Action Required'),
        faculty.courses.filter(function(c){return!c.syllabusUploaded}).map(function(c,i){
          return h('div',{key:i,style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:T.amberL,borderRadius:8,marginBottom:8}},
            h('span',{style:{color:T.amber}},Icons.alert()),
            h('span',{style:{fontSize:13}},'Upload syllabus for ',h('strong',null,c.code+' '+c.title)));
        }),
        faculty.courses.every(function(c){return c.syllabusUploaded})&&h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:T.greenL,borderRadius:8}},
          h('span',{style:{color:T.green}},Icons.check()),h('span',{style:{fontSize:13,color:T.green,fontWeight:500}},'All tasks completed!'))
      ),
      h(Card,null,
        h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:'0 0 14px'}},'Recent Notices'),
        faculty.notices.slice(0,3).map(function(n){
          return h('div',{key:n.id,onClick:function(){setTab('notices');setSelNotice(n);},style:{padding:'10px 0',borderBottom:'1px solid '+T.bdr,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}},
            h('div',null,
              h('div',{style:{fontSize:13,fontWeight:600,color:T.text}},n.title),
              h('div',{style:{fontSize:11,color:T.sub,marginTop:2}},n.date)),
            n.priority==='high'&&h('span',{style:{padding:'2px 8px',borderRadius:10,fontSize:10,fontWeight:600,background:'#fef2f2',color:T.red}},'Important'));
        })
      )
    );
  }

  function CoursesTab(){
    return h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
      h('h2',{style:{fontSize:20,fontWeight:700,color:T.navy,margin:0,fontFamily:"'Playfair Display',serif"}},'My Courses'),
      faculty.courses.map(function(c,i){
        return h(Card,{key:i},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12,flexWrap:'wrap',gap:8}},
            h('div',null,
              h('span',{style:{fontSize:11,fontWeight:700,color:T.navy,background:'rgba(0,55,100,.08)',padding:'3px 8px',borderRadius:4}},c.code),
              h('h3',{style:{fontSize:16,fontWeight:700,color:T.text,margin:'8px 0 0'}},c.title)),
            h('span',{style:{padding:'4px 10px',borderRadius:20,fontSize:11,fontWeight:600,background:'rgba(0,55,100,.06)',color:T.navy}},c.period)),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:13,color:T.sub,marginBottom:16}},
            h('div',null,'📅 '+c.schedule),h('div',null,'📍 '+c.room),
            h('div',null,'👥 '+c.students+' students'),
            h('div',null,'📄 Syllabus: ',c.syllabusUploaded?h('span',{style:{color:T.green,fontWeight:600}},'Uploaded'):h('span',{style:{color:T.amber,fontWeight:600}},'Not uploaded'))),
          h('div',{style:{display:'flex',gap:8}},
            c.syllabusUploaded?
              h('button',{style:{padding:'8px 16px',background:'rgba(0,55,100,.06)',color:T.navy,border:'none',borderRadius:8,fontSize:13,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:6}},Icons.download(),' Download Syllabus'):
              h('button',{style:{padding:'8px 16px',background:T.navy,color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:600,fontFamily:'inherit'}},'Upload Syllabus'))
        );
      })
    );
  }

  function DocumentsTab(){
    return h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
      h('h2',{style:{fontSize:20,fontWeight:700,color:T.navy,margin:0,fontFamily:"'Playfair Display',serif"}},'Documents'),
      h(Card,null,
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
          h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:0}},'📝 Employment Contract'),
          Badge({status:faculty.documents.contract.status})),
        h('p',{style:{fontSize:13,color:T.sub,margin:'0 0 12px'}},'Signed on '+faculty.documents.contract.date),
        h('button',{style:{padding:'8px 16px',background:'rgba(0,55,100,.06)',color:T.navy,border:'none',borderRadius:8,fontSize:13,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:6}},Icons.download(),' '+faculty.documents.contract.fileName)),
      h(Card,null,
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
          h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:0}},'📄 Reappointment Documents'),
          Badge({status:faculty.documents.reappointment.status})),
        h('p',{style:{fontSize:13,color:T.sub,margin:'0 0 12px'}},'Submitted on '+faculty.documents.reappointment.date),
        h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
          faculty.documents.reappointment.files.map(function(f,i){
            return h('div',{key:i,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:'#f8f9fb',borderRadius:8}},
              h('span',{style:{fontSize:13,color:T.text}},f),
              h('button',{style:{background:'none',border:'none',color:T.navy,cursor:'pointer',display:'flex'}},Icons.download()));
          }))),
      h(Card,null,
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
          h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:0}},'📋 Syllabus Submission'),
          Badge({status:faculty.documents.syllabus.submitted===faculty.documents.syllabus.total?'submitted':'partial'})),
        h('p',{style:{fontSize:13,color:T.sub,margin:0}},faculty.documents.syllabus.submitted+' of '+faculty.documents.syllabus.total+' syllabi submitted'))
    );
  }

  function NoticesTab(){
    return h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
      h('h2',{style:{fontSize:20,fontWeight:700,color:T.navy,margin:0,fontFamily:"'Playfair Display',serif"}},'Notices'),
      selNotice?
        h(Card,null,
          h('button',{onClick:function(){setSelNotice(null)},style:{background:'none',border:'none',color:T.navy,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',padding:0,marginBottom:16}},'← Back to list'),
          h('div',{style:{marginBottom:8}},
            selNotice.priority==='high'&&h('span',{style:{padding:'2px 8px',borderRadius:10,fontSize:10,fontWeight:600,background:'#fef2f2',color:T.red,marginRight:8}},'Important'),
            h('span',{style:{fontSize:12,color:T.sub}},selNotice.date)),
          h('h3',{style:{fontSize:18,fontWeight:700,color:T.text,margin:'0 0 16px'}},selNotice.title),
          h('p',{style:{fontSize:14,color:T.text,lineHeight:1.7}},selNotice.content)):
        faculty.notices.map(function(n){
          return h(Card,{key:n.id,style:{cursor:'pointer'}},
            h('div',{onClick:function(){setSelNotice(n)},style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
              h('div',null,
                h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
                  n.priority==='high'&&h('span',{style:{padding:'2px 8px',borderRadius:10,fontSize:10,fontWeight:600,background:'#fef2f2',color:T.red}},'Important'),
                  h('span',{style:{fontSize:12,color:T.sub}},n.date)),
                h('h3',{style:{fontSize:15,fontWeight:600,color:T.text,margin:0}},n.title),
                h('p',{style:{fontSize:13,color:T.sub,margin:'6px 0 0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:400}},n.content)),
              h('span',{style:{fontSize:18,color:T.bdr}},'›')));
        })
    );
  }

  var tabContent={dashboard:DashboardTab,courses:CoursesTab,documents:DocumentsTab,notices:NoticesTab};

  return h('div',{style:{minHeight:'100vh',background:T.bg,fontFamily:"'Noto Sans',-apple-system,sans-serif"}},
    fadeStyle,
    // Top Nav
    h('nav',{style:{background:T.navy,padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',height:56,position:'sticky',top:0,zIndex:100}},
      h('div',{style:{display:'flex',alignItems:'center',gap:12}},
        h('span',{style:{fontSize:20}},'🏛️'),
        h('span',{style:{color:'#fff',fontSize:15,fontWeight:700,fontFamily:"'Playfair Display',serif"}},'YISS Faculty Portal')),
      h('div',{style:{display:'flex',alignItems:'center',gap:16}},
        h('span',{style:{color:'rgba(255,255,255,.7)',fontSize:13}},faculty.name),
        h('button',{onClick:handleLogout,style:{background:'rgba(255,255,255,.1)',border:'none',borderRadius:8,padding:'6px 12px',color:'rgba(255,255,255,.8)',display:'flex',alignItems:'center',gap:6,fontSize:12,fontFamily:'inherit',fontWeight:500}},
          Icons.logout(),' Sign Out'))
    ),
    h('div',{style:{display:'flex',maxWidth:1100,margin:'0 auto',padding:'0 16px'}},
      // Sidebar
      h('aside',{className:'desk-show',style:{width:220,padding:'20px 0',flexShrink:0,position:'sticky',top:56,height:'calc(100vh - 56px)',display:'none'}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
          tabs.map(function(t){
            return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,border:'none',background:tab===t.key?'rgba(0,55,100,.08)':'transparent',color:tab===t.key?T.navy:T.sub,fontSize:14,fontWeight:tab===t.key?600:400,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}},
              t.icon(),' ',t.label);
          }))),
      // Main
      h('main',{style:{flex:1,padding:'20px 0 100px',minWidth:0,marginLeft:16}},
        h(tabContent[tab]))
    ),
    // Mobile Bottom Nav
    h('div',{className:'mob-hide',style:{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid '+T.bdr,display:'flex',justifyContent:'space-around',padding:'6px 0',zIndex:100}},
      tabs.map(function(t){
        return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,background:'none',border:'none',padding:'6px 12px',color:tab===t.key?T.navy:T.sub,fontFamily:'inherit',fontSize:10,fontWeight:tab===t.key?600:400}},
          t.icon(),t.label);
      }))
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
